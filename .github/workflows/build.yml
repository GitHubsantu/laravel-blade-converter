name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean `
            --name "LaravelBladeConverter" `
            --windowed `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            main.py

      - name: Verify build output
        run: |
          if (!(Test-Path "dist\LaravelBladeConverter\LaravelBladeConverter.exe")) {
            Write-Error "Build failed: executable not found."
            exit 1
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Verify installer output
        run: |
          if (!(Test-Path "Output\LaravelBladeConverterSetup.exe")) {
            Write-Error "Installer build failed: setup exe not found."
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaravelBladeConverterSetup
          path: Output\LaravelBladeConverterSetup.exe
          if-no-files-found: error

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaravelBladeConverter-portable
          path: dist\LaravelBladeConverter\
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LaravelBladeConverterSetup
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/LaravelBladeConverterSetup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}