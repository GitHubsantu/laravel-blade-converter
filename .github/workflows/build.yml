name: Build Desktop Executables

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LaravelBladeConverter-windows
          - os: macos-latest
            artifact_name: LaravelBladeConverter-macos
          - os: ubuntu-latest
            artifact_name: LaravelBladeConverter-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller blade_converter.spec --noconfirm

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Package artifact (zip)
        shell: bash
        run: |
          cd dist
          if [ -d "LaravelBladeConverter.app" ]; then
            zip -r "../${{ matrix.artifact_name }}.zip" "LaravelBladeConverter.app"
          fi
          zip -r "../${{ matrix.artifact_name }}.zip" "LaravelBladeConverter"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
